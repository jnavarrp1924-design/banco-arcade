
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080f1e">
<title>Tu raíz es nuestra raíz</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --navy:#080f1e;
  --blue:#1769bd;
  --blue-light:#4b9df0;
  --red:#bd2638;
  --red-light:#ef5965;
  --white:#f4f6fb;
  --muted:#9baec8;
}

* { box-sizing:border-box; }

body {
  margin:0;
  min-height:100vh;
  padding:22px 15px 35px;
  color:var(--white);
  font-family:'Outfit',sans-serif;
  background:
    radial-gradient(ellipse at 5% 8%, #102c4b 0%, transparent 38%),
    radial-gradient(ellipse at 100% 90%, #481923 0%, transparent 42%),
    linear-gradient(135deg, #070d19 0%, #0b1424 48%, #120c19 100%);
  overflow-x:hidden;
  position:relative;
}

body::before {
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.19;
  background:
    repeating-linear-gradient(135deg, transparent 0px, transparent 38px, #24415d 39px, transparent 40px, transparent 78px),
    repeating-linear-gradient(45deg, transparent 0px, transparent 58px, #642a39 59px, transparent 60px, transparent 116px);
  mask-image:linear-gradient(to bottom, transparent, black 20%, black 75%, transparent);
}

body::after {
  content:"";
  position:fixed;
  width:390px;
  height:390px;
  border:1px solid #31516a25;
  border-radius:50%;
  top:22%;
  right:-290px;
  box-shadow:
    0 0 0 28px #31516a0c,
    0 0 0 58px #31516a09,
    0 0 0 90px #31516a06;
  pointer-events:none;
}

main {
  width:100%;
  max-width:510px;
  margin:auto;
  position:relative;
  z-index:1;
}

/* ENCABEZADO */

.topline {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:9px;
  color:#9eb6d6;
  font-size:10px;
  font-weight:800;
  letter-spacing:3px;
  margin:8px 0 23px;
}

.topline::before,
.topline::after {
  content:"";
  height:1px;
  flex:1;
  max-width:55px;
  background:linear-gradient(90deg,transparent,#46658b);
}

.topline::after {
  background:linear-gradient(90deg,#46658b,transparent);
}

.hero {
  text-align:center;
  position:relative;
  padding:10px 0 22px;
}

.hero::before {
  content:"";
  position:absolute;
  width:220px;
  height:110px;
  left:50%;
  top:0;
  transform:translateX(-50%);
  background:#174c83;
  filter:blur(75px);
  opacity:.3;
  z-index:-1;
}

.kicker {
  color:#b6c8e1;
  font-size:12px;
  font-weight:800;
  letter-spacing:4px;
  margin-bottom:12px;
}

h1 {
  margin:0;
  font-family:'Barlow Condensed',sans-serif;
  font-size:clamp(58px,14vw,78px);
  font-weight:900;
  line-height:.82;
  letter-spacing:-1px;
  text-transform:uppercase;
  text-shadow:0 5px 22px #0009;
}

h1 span {
  display:block;
  color:var(--red-light);
  margin-top:8px;
}

.hero-line {
  width:100px;
  height:5px;
  margin:19px auto 0;
  background:linear-gradient(90deg,var(--blue-light),var(--red-light));
  border-radius:8px;
  transform:skewX(-25deg);
}

/* IDENTIFICACIÓN DEL GRUPO */

.group-block {
  margin:18px 0 25px;
  text-align:center;
  position:relative;
}

.group-label {
  color:#91a9c8;
  font-size:10px;
  font-weight:800;
  letter-spacing:5px;
  margin-bottom:5px;
}

.group-name {
  font-family:'Barlow Condensed',sans-serif;
  font-size:clamp(38px,10vw,51px);
  font-weight:800;
  text-transform:uppercase;
  line-height:1;
  letter-spacing:1px;
  overflow-wrap:anywhere;
  text-shadow:0 4px 18px #0008;
}

.group-underline {
  width:65px;
  height:3px;
  margin:11px auto 0;
  background:var(--blue-light);
  border-radius:5px;
}

/* PANEL PRINCIPAL */

.dashboard {
  border:1px solid #30445f;
  border-radius:25px;
  padding:17px 12px 19px;
  background:linear-gradient(145deg,#15243aee,#0b1628f5);
  box-shadow:0 20px 50px #0007;
  position:relative;
  overflow:hidden;
}

.dashboard::after {
  content:"ARCADE";
  position:absolute;
  right:-8px;
  top:0;
  font-family:'Barlow Condensed',sans-serif;
  font-size:66px;
  font-weight:900;
  letter-spacing:5px;
  color:#ffffff;
  opacity:.025;
  pointer-events:none;
}

.status {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  min-height:39px;
  margin:0 0 14px;
  color:#afc0d8;
  font-size:13px;
  text-align:center;
}

.status-dot {
  width:8px;
  height:8px;
  border-radius:50%;
  background:#4b9df0;
  box-shadow:0 0 12px #4b9df0;
  flex-shrink:0;
}

/* CONTENEDOR DE VALORES */

.values {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.value-card {
  min-width:0;
  height:252px;
  position:relative;
  border-radius:20px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:17px 8px;
  isolation:isolate;
  box-shadow:0 12px 25px #0005;
}

.value-card > * {
  position:relative;
  z-index:2;
}

/* TARJETA DINERO: ACABADO METÁLICO AZUL */

.money-card {
  border:1px solid #69b5ff;
  background:
    linear-gradient(115deg,#ffffff18 0%,transparent 23%,transparent 72%,#07172b55 100%),
    radial-gradient(ellipse at 50% 25%,#55aaff55 0%,transparent 54%),
    linear-gradient(145deg,#1d5b91 0%,#123c68 42%,#081a30 100%);
  box-shadow:
    inset 0 1px 1px #ffffff55,
    inset 0 -9px 18px #020b18a8,
    0 13px 24px #0008,
    0 0 20px #1d69ad22;
}

.money-card::before {
  content:"";
  position:absolute;
  inset:0;
  opacity:.34;
  background:repeating-linear-gradient(
    125deg,
    transparent 0px,
    transparent 9px,
    #b8dcff18 10px,
    transparent 11px,
    transparent 20px
  );
  pointer-events:none;
}

.money-card::after {
  content:"";
  position:absolute;
  width:190px;
  height:190px;
  border:1px solid #a9d7ff55;
  border-radius:50%;
  top:-82px;
  right:-88px;
  box-shadow:
    0 0 0 12px #9acfff12,
    0 0 0 26px #9acfff0d,
    0 0 0 43px #9acfff08;
  pointer-events:none;
}

/* TARJETA TICKETS: ACABADO TROQUELADO ROJO */

.ticket-card {
  border:1px solid #ff7885;
  background:
    linear-gradient(115deg,#ffffff14 0%,transparent 25%,transparent 72%,#16091166 100%),
    radial-gradient(ellipse at 50% 25%,#e34a5e55 0%,transparent 55%),
    linear-gradient(145deg,#76283b 0%,#4b1c2d 48%,#21121e 100%);
  box-shadow:
    inset 0 1px 1px #ffffff45,
    inset 0 -9px 18px #120710a8,
    0 13px 24px #0008,
    0 0 20px #a52b4022;
}

.ticket-card::before {
  content:"";
  position:absolute;
  inset:10px;
  border:1px dashed #ffb0b8a8;
  border-radius:13px;
  opacity:.72;
  background:repeating-linear-gradient(
    135deg,
    transparent 0px,
    transparent 12px,
    #ffb1ba12 13px,
    transparent 14px
  );
  pointer-events:none;
}

.ticket-card::after {
  content:"";
  position:absolute;
  width:180px;
  height:65px;
  background:linear-gradient(90deg,#f05a6b66,#8f263b22);
  opacity:.55;
  bottom:-30px;
  right:-35px;
  transform:rotate(-18deg);
  border-radius:50%;
  pointer-events:none;
}

/* ICONOS */

.icon-wrap {
  width:80px;
  height:80px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:10px;
  border-radius:23px;
  background:#ffffff0c;
  border:1px solid #ffffff19;
  box-shadow:
    inset 0 1px 1px #ffffff2b,
    inset 0 -4px 8px #0004,
    0 8px 18px #0005;
}

.icon-wrap svg {
  width:58px;
  height:58px;
  filter:drop-shadow(0 4px 7px #0007);
}

.label {
  color:#c1cee0;
  font-size:11px;
  font-weight:800;
  letter-spacing:4px;
  margin-bottom:12px;
}

.amount {
  font-size:clamp(25px,6.5vw,35px);
  font-weight:900;
  letter-spacing:-1.5px;
  text-shadow:0 3px 12px #0007;
  overflow-wrap:anywhere;
  text-align:center;
}

.currency {
  color:#9fc5ee;
  font-size:12px;
  font-weight:800;
  letter-spacing:3px;
  margin-top:7px;
}

.ticket-number {
  font-family:'Barlow Condensed',sans-serif;
  font-size:72px;
  line-height:.9;
  font-weight:800;
  text-shadow:0 4px 15px #0008;
}

/* DETALLE INFERIOR */

.success {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  color:#b7c6d9;
  font-size:13px;
  text-align:center;
  margin:23px 0 2px;
}

.check {
  width:25px;
  height:25px;
  border:1px solid #6686ac;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#c8e1ff;
  flex-shrink:0;
}

.footer {
  margin-top:23px;
  text-align:center;
  color:#687e9c;
  font-size:10px;
  font-weight:800;
  letter-spacing:3px;
}

@media(max-width:360px) {
  body { padding:17px 10px 25px; }
  .dashboard { padding:14px 8px; }
  .values { gap:8px; }
  .value-card { height:220px; padding:12px 5px; }
  .icon-wrap { width:67px; height:67px; }
  .icon-wrap svg { width:50px; height:50px; }
  .amount { font-size:23px; }
  .ticket-number { font-size:62px; }
  .label { letter-spacing:2px; }
}
</style>
</head>

<body>
<main>

  <div class="topline">VIVE DESDE TU RAÍZ</div>

  <header class="hero">
    <div class="kicker">TU HISTORIA COMIENZA AQUÍ</div>
    <h1>Tu raíz es <span>nuestra raíz</span></h1>
    <div class="hero-line"></div>
  </header>

  <section class="group-block">
    <div class="group-label">EQUIPO</div>
    <div class="group-name" id="nombre">Tu grupo</div>
    <div class="group-underline"></div>
  </section>

  <section class="dashboard">
    <p class="status" id="estado">
      <span class="status-dot"></span>
      Esperando una tarjeta NFC...
    </p>

    <!-- Las tarjetas se muestran inicialmente con valores de ejemplo.
         Al escanear una tarjeta válida, se actualizan con los datos reales. -->
    <section id="consulta">
      <div class="values">

        <article class="value-card money-card">
          <div class="icon-wrap">
            <svg viewBox="0 0 64 64" fill="none"
                 xmlns="http://www.w3.org/2000/svg">
              <ellipse cx="25" cy="17" rx="17" ry="8"
                       stroke="#9bd0ff" stroke-width="3"/>
              <path d="M8 17v25c0 5 8 9 17 9s17-4 17-9V17"
                    stroke="#75b8ff" stroke-width="3"/>
              <path d="M8 29c0 5 8 9 17 9s17-4 17-9"
                    stroke="#75b8ff" stroke-width="3"/>
              <path d="M8 40c0 5 8 9 17 9"
                    stroke="#75b8ff" stroke-width="3"/>
              <circle cx="45" cy="43" r="15"
                      fill="#123d70" stroke="#b5dcff" stroke-width="3"/>
              <path d="M49 37c-2-3-9-3-9 1 0 5 10 2 10 7 0 4-7 6-11 2M45 34v19"
                    stroke="#d9edff" stroke-width="2"
                    stroke-linecap="round"/>
            </svg>
          </div>
          <div class="label">DINERO</div>
          <div class="amount" id="dinero">$100.000</div>
          <div class="currency">COP</div>
        </article>

        <article class="value-card ticket-card">
          <div class="icon-wrap">
            <svg viewBox="0 0 64 64" fill="none"
                 xmlns="http://www.w3.org/2000/svg">
              <path d="M12 17h40v10a6 6 0 0 0 0 12v10H12V39a6 6 0 0 0 0-12V17Z"
                    fill="#7c293b" stroke="#ff9aa3" stroke-width="3"/>
              <path d="M32 20v25" stroke="#ffb1b8"
                    stroke-width="2" stroke-dasharray="3 4"/>
              <path d="m22 32 7 7 14-15"
                    stroke="#ffe1e3" stroke-width="3"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="label">TICKETS</div>
          <div class="ticket-number" id="tickets">0</div>
        </article>

      </div>

      <div class="success">
        <span class="check">✓</span>
        Consulta realizada correctamente.
      </div>
    </section>
  </section>

  <footer class="footer">TU RAÍZ ES NUESTRA RAÍZ</footer>
</main>

<script>
const SUPABASE_URL = "https://ecuxshgbftpnurcfviir.supabase.co";
const SUPABASE_KEY = "sb_publishable_r8DPVtISS2k6_YKrA21Ydw_ujwqMDbr";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function iniciar() {
  const token = new URLSearchParams(window.location.search)
    .get("card");

  if (!token) {
    document.getElementById("estado").textContent =
      "Vista previa: valores de ejemplo.";
    return;
  }

  document.getElementById("estado").textContent =
    "Consultando grupo...";

  const { data, error } = await supabaseClient.rpc(
    "consultar_equipo",
    { p_token_tarjeta: token }
  );

  if (error) {
    document.getElementById("estado").textContent =
      "Error: " + error.message;
    console.error(error);
    return;
  }

  if (!data || data.error) {
    document.getElementById("estado").textContent =
      "Tarjeta no válida o inactiva.";
    return;
  }

  document.getElementById("nombre").textContent = data.nombre;

  document.getElementById("dinero").textContent =
    "$" + Number(data.monedas).toLocaleString("es-CO");

  document.getElementById("tickets").textContent =
    data.tickets;

  document.getElementById("estado").style.display = "none";
  document.querySelector(".success").style.display = "flex";
}

iniciar();
</script>
</body>
</html>
