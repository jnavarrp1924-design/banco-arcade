
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070b12">
<title>Tu raíz es nuestra raíz</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --navy:#070b12;
  --blue:#17334a;
  --blue-light:#6d9bb8;
  --red:#401d28;
  --red-light:#a75a65;
  --white:#f1f2f4;
  --muted:#9baec8;
}

* { box-sizing:border-box; }

body {
  margin:0;
  min-height:100vh;
  padding:22px 15px 35px;
  color:var(--white);
  font-family:'Outfit',sans-serif;
  background:
    radial-gradient(ellipse at 0% 15%, #102236 0%, transparent 38%),
    radial-gradient(ellipse at 100% 85%, #29131d 0%, transparent 42%),
    linear-gradient(135deg,#05080e 0%,#0a111b 48%,#100a10 100%);
  overflow-x:hidden;
  position:relative;
}

body::before {
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.15;
  background:
    repeating-linear-gradient(135deg,transparent 0px,transparent 38px,#24415d 39px,transparent 40px,transparent 78px),
    repeating-linear-gradient(45deg,transparent 0px,transparent 58px,#642a39 59px,transparent 60px,transparent 116px);
  mask-image:linear-gradient(to bottom,transparent,black 20%,black 75%,transparent);
}

body::after {
  content:"";
  position:fixed;
  width:390px;
  height:390px;
  border:1px solid #31516a25;
  border-radius:50%;
  top:22%;
  right:-290px;
  box-shadow:0 0 0 28px #31516a0c,0 0 0 58px #31516a09,0 0 0 90px #31516a06;
  pointer-events:none;
}

main {
  width:100%;
  max-width:510px;
  margin:auto;
  position:relative;
  z-index:1;
}

/* ENCABEZADO */

.topline {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:9px;
  color:#9eb6c5;
  font-size:10px;
  font-weight:800;
  letter-spacing:3px;
  margin:8px 0 23px;
}

.topline::before,
.topline::after {
  content:"";
  height:1px;
  flex:1;
  max-width:55px;
  background:linear-gradient(90deg,transparent,#46658b);
}

.topline::after {
  background:linear-gradient(90deg,#46658b,transparent);
}

.hero {
  text-align:center;
  position:relative;
  padding:10px 0 22px;
}

.hero::before {
  content:"";
  position:absolute;
  width:220px;
  height:110px;
  left:50%;
  top:0;
  transform:translateX(-50%);
  background:#174c83;
  filter:blur(75px);
  opacity:.22;
  z-index:-1;
}

h1 {
  margin:0;
  font-family:'Barlow Condensed',sans-serif;
  font-size:clamp(58px,14vw,78px);
  font-weight:900;
  line-height:.82;
  letter-spacing:-1px;
  text-transform:uppercase;
  text-shadow:0 5px 22px #0009;
}

h1 span {
  display:block;
  color:#91414d;
  margin-top:8px;
  text-shadow:0 3px 0 #3b1720,0 7px 20px #000;
}

.hero-line {
  width:100px;
  height:4px;
  margin:19px auto 0;
  background:linear-gradient(90deg,#527f9d,#843542);
  border-radius:8px;
  transform:skewX(-25deg);
  box-shadow:0 0 12px #345b782c;
}

/* IDENTIFICACIÓN DEL GRUPO */

.group-block {
  margin:18px 0 25px;
  text-align:center;
  position:relative;
}

.group-label {
  color:#91a9c8;
  font-size:10px;
  font-weight:800;
  letter-spacing:5px;
  margin-bottom:5px;
}

.group-name {
  font-family:'Barlow Condensed',sans-serif;
  font-size:clamp(38px,10vw,51px);
  font-weight:800;
  text-transform:uppercase;
  line-height:1;
  letter-spacing:1px;
  overflow-wrap:anywhere;
  text-shadow:0 4px 18px #0008;
}

.group-underline {
  width:65px;
  height:3px;
  margin:11px auto 0;
  background:#547f9a;
  border-radius:5px;
}

/* PANEL PRINCIPAL */

.dashboard {
  border:1px solid #293746;
  border-radius:25px;
  padding:17px 12px 19px;
  background:linear-gradient(145deg,#111d2aee,#090f17f5);
  box-shadow:0 20px 50px #0009,inset 0 1px 0 #ffffff0b;
  position:relative;
  overflow:hidden;
}

.dashboard::after {
  content:"ARCADE";
  position:absolute;
  right:-8px;
  top:0;
  font-family:'Barlow Condensed',sans-serif;
  font-size:66px;
  font-weight:900;
  letter-spacing:5px;
  color:#ffffff;
  opacity:.025;
  pointer-events:none;
}

.status {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  min-height:39px;
  margin:0 0 14px;
  color:#afc0d8;
  font-size:13px;
  text-align:center;
}

.status-dot {
  width:8px;
  height:8px;
  border-radius:50%;
  background:#527e9d;
  box-shadow:0 0 12px #527e9d;
  flex-shrink:0;
}

/* CONTENEDOR DE TARJETAS */

.values {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  perspective:1000px;
}

.value-card {
  min-width:0;
  height:290px;
  position:relative;
  border-radius:21px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  padding:18px 9px;
  isolation:isolate;
  transform-style:preserve-3d;
  transition:transform .35s ease,box-shadow .35s ease;
}

.value-card:hover {
  transform:translateY(-6px) rotateX(2deg) rotateY(-2deg);
}

.value-card > * {
  position:relative;
  z-index:2;
}

/* DETALLES COMUNES 3D */

.value-card .card-frame {
  position:absolute;
  inset:7px;
  border:1px solid #ffffff25;
  border-radius:15px;
  pointer-events:none;
  z-index:1;
}

.card-top {
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:9px;
  font-weight:800;
  letter-spacing:2px;
  opacity:.75;
}

.card-number {
  font-family:'Barlow Condensed',sans-serif;
  font-size:14px;
  letter-spacing:1px;
}

.card-icon {
  width:104px;
  height:104px;
  display:grid;
  place-items:center;
  border-radius:50%;
  transform:translateZ(25px);
}

.card-icon svg {
  width:86px;
  height:86px;
  filter:drop-shadow(0 9px 5px #0009);
}

.card-label {
  min-width:125px;
  text-align:center;
  padding:7px 15px;
  border-radius:6px;
  font-size:12px;
  font-weight:900;
  letter-spacing:3px;
  color:#e7edf1;
  box-shadow:0 5px 8px #0008,inset 0 1px 1px #ffffff55;
  transform:translateZ(18px);
}

.card-value {
  width:100%;
  text-align:center;
  font-size:clamp(24px,6vw,35px);
  font-weight:900;
  letter-spacing:-1.5px;
  overflow-wrap:anywhere;
  text-shadow:0 2px 0 #64717b,0 4px 0 #26313b,0 7px 9px #000c;
  transform:translateZ(20px);
}

.card-unit {
  font-size:9px;
  font-weight:800;
  letter-spacing:2px;
}

.card-bottom-line {
  width:65%;
  height:3px;
  border-radius:50%;
}

/* TARJETA DINERO: AZUL METÁLICO */

.money-card {
  color:#e8f0f5;
  border:1px solid #718b9d;
  background:linear-gradient(145deg,#526c7e 0%,#1a3448 30%,#091725 78%,#30495a 100%);
  box-shadow:
    inset 0 2px 3px #ffffff55,
    inset 0 -9px 18px #020b18c9,
    0 15px 25px #000a,
    0 3px 0 #263d4d;
}

.money-card::before {
  content:"";
  position:absolute;
  inset:0;
  opacity:.35;
  background:
    repeating-linear-gradient(135deg,transparent 0,transparent 9px,#c0d8e318 10px,transparent 11px,transparent 20px),
    radial-gradient(ellipse at 50% 35%,#5e9cbd35,transparent 65%);
  pointer-events:none;
}

.money-card::after {
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  border:1px solid #a9d7ff44;
  border-radius:50%;
  top:-80px;
  right:-90px;
  box-shadow:0 0 0 12px #9acfff10,0 0 0 26px #9acfff09,0 0 0 43px #9acfff06;
  pointer-events:none;
}

.money-card .card-top { color:#c3d4df; }

.money-card .card-icon {
  background:radial-gradient(circle,#315c77,#102536 72%);
  border:2px solid #668da5;
  box-shadow:0 0 0 5px #557f991c,0 0 22px #3981a32a,inset 0 0 15px #000b;
}

.money-card .card-label {
  background:linear-gradient(180deg,#607887,#263b49 55%,#172834);
  border:1px solid #91a6b2;
}

.money-card .card-value { color:#f0f4f6; }

.money-card .card-unit { color:#a9c3d3; }

.money-card .card-bottom-line {
  background:#608da8;
  box-shadow:0 0 10px #5395b944;
}

/* TARJETA TICKETS: ROJO BORGOÑA METÁLICO */

.ticket-card {
  color:#f4e8e9;
  border:1px solid #95616a;
  background:linear-gradient(145deg,#78444c 0%,#46232d 35%,#180f17 78%,#44202b 100%);
  box-shadow:
    inset 0 2px 3px #ffffff38,
    inset 0 -9px 18px #120710c9,
    0 15px 25px #000a,
    0 3px 0 #3b2028;
}

.ticket-card::before {
  content:"";
  position:absolute;
  inset:9px;
  border:1px dashed #e9a7ae77;
  border-radius:14px;
  opacity:.7;
  background:repeating-linear-gradient(135deg,transparent 0,transparent 12px,#ffb1ba10 13px,transparent 14px);
  pointer-events:none;
}

.ticket-card::after {
  content:"";
  position:absolute;
  width:180px;
  height:65px;
  background:linear-gradient(90deg,#f05a6b44,#8f263b11);
  opacity:.55;
  bottom:-30px;
  right:-35px;
  transform:rotate(-18deg);
  border-radius:50%;
  pointer-events:none;
}

.ticket-card .card-top { color:#e2b6bb; }

.ticket-card .card-icon {
  background:radial-gradient(circle,#6b3541,#24131c 72%);
  border:2px solid #a66b75;
  box-shadow:0 0 0 5px #9439491c,0 0 22px #ad2c3d24,inset 0 0 15px #000b;
}

.ticket-card .card-label {
  background:linear-gradient(180deg,#94545e,#522b35 55%,#2d1922);
  border:1px solid #b77b83;
}

.ticket-card .card-value {
  font-family:'Barlow Condensed',sans-serif;
  font-size:72px;
  line-height:.9;
  color:#f5e5e6;
  text-shadow:0 2px 0 #98646a,0 4px 0 #48232d,0 7px 9px #000c;
}

.ticket-card .card-unit { color:#d2a0a6; }

.ticket-card .card-bottom-line {
  background:#99515d;
  box-shadow:0 0 10px #be3a4d55;
}

/* DETALLE INFERIOR */

.success {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  color:#b7c6d9;
  font-size:13px;
  text-align:center;
  margin:23px 0 2px;
}

.check {
  width:25px;
  height:25px;
  border:1px solid #6686ac;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#c8e1ff;
  flex-shrink:0;
}

.footer {
  margin-top:23px;
  text-align:center;
  color:#687e8d;
  font-size:10px;
  font-weight:800;
  letter-spacing:3px;
}

/* ADAPTACIÓN A CELULARES */

@media(max-width:420px) {
  body { padding:17px 10px 25px; }

  .dashboard { padding:14px 8px; }

  .values { gap:9px; }

  .value-card {
    height:260px;
    padding:15px 6px;
  }

  .card-icon {
    width:82px;
    height:82px;
  }

  .card-icon svg {
    width:70px;
    height:70px;
  }

  .card-value { font-size:25px; }

  .ticket-card .card-value { font-size:62px; }

  .card-label {
    min-width:0;
    padding:6px 12px;
    font-size:10px;
  }

  .card-unit {
    font-size:8px;
    letter-spacing:1px;
  }
}

@media(max-width:340px) {
  .value-card { height:235px; }
  .card-icon { width:68px;height:68px; }
  .card-icon svg { width:58px;height:58px; }
  .card-value { font-size:22px; }
  .ticket-card .card-value { font-size:55px; }
}
</style>
</head>

<body>
<main>

  <div class="topline">VIVE DESDE TU RAÍZ</div>

  <header class="hero">
    <h1>Tu raíz es <span>nuestra raíz</span></h1>
    <div class="hero-line"></div>
  </header>

  <section class="group-block">
    <div class="group-label">EQUIPO</div>
    <div class="group-name" id="nombre">Tu grupo</div>
    <div class="group-underline"></div>
  </section>

  <section class="dashboard">
    <p class="status" id="estado">
      <span class="status-dot"></span>
      Esperando una tarjeta NFC...
    </p>

    <!-- Las tarjetas muestran valores de ejemplo hasta consultar una tarjeta -->
    <section id="consulta">
      <div class="values">

        <!-- TARJETA DINERO -->
        <article class="value-card money-card">
          <div class="card-frame"></div>

          <div class="card-top">
            <span>RECURSOS</span>
            <span class="card-number">01</span>
          </div>

          <div class="card-icon">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
              <ellipse cx="25" cy="17" rx="17" ry="8" fill="#D49A43" stroke="#FFE2A0" stroke-width="2"/>
              <path d="M8 17v25c0 5 8 9 17 9s17-4 17-9V17" fill="#A66B25" stroke="#DCA954" stroke-width="2"/>
              <path d="M8 29c0 5 8 9 17 9s17-4 17-9" stroke="#F5CB78" stroke-width="2"/>
              <path d="M8 40c0 5 8 9 17 9" stroke="#F5CB78" stroke-width="2"/>
              <circle cx="45" cy="43" r="15" fill="#D69A36" stroke="#FFE5A5" stroke-width="2"/>
              <path d="M49 37c-2-3-9-3-9 1 0 5 10 2 10 7 0 4-7 6-11 2M45 34v19" stroke="#FFF0C5" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>

          <div class="card-label">DINERO</div>
          <div class="card-value" id="dinero">$100.000</div>
          <div class="card-unit">PESOS COLOMBIANOS</div>
          <div class="card-bottom-line"></div>
        </article>

        <!-- TARJETA TICKETS -->
        <article class="value-card ticket-card">
          <div class="card-frame"></div>

          <div class="card-top">
            <span>RECOMPENSAS</span>
            <span class="card-number">02</span>
          </div>

          <div class="card-icon">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 17h40v10a6 6 0 0 0 0 12v10H12V39a6 6 0 0 0 0-12V17Z" fill="#A83C4A" stroke="#F08B91" stroke-width="2.5"/>
              <path d="M32 20v25" stroke="#F6B4B8" stroke-width="2" stroke-dasharray="3 3"/>
              <path d="m32 25 2.5 5 5.5 1-4 4 1 6-5-3-5 3 1-6-4-4 5.5-1 2.5-5Z" fill="#FFE0D2"/>
            </svg>
          </div>

          <div class="card-label">TICKETS</div>
          <div class="card-value" id="tickets">0</div>
          <div class="card-unit">TUS RECOMPENSAS</div>
          <div class="card-bottom-line"></div>
        </article>

      </div>

      <div class="success">
        <span class="check">✓</span>
        Consulta realizada correctamente.
      </div>
    </section>
  </section>

  <footer class="footer">TU RAÍZ ES NUESTRA RAÍZ</footer>
</main>

<script>
const SUPABASE_URL = "https://ecuxshgbftpnurcfviir.supabase.co";
const SUPABASE_KEY = "sb_publishable_r8DPVtISS2k6_YKrA21Ydw_ujwqMDbr";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function iniciar() {
  const token = new URLSearchParams(window.location.search)
    .get("card");

  if (!token) {
    document.getElementById("estado").textContent =
      "Vista previa: valores de ejemplo.";
    return;
  }

  document.getElementById("estado").textContent =
    "Consultando grupo...";

  const { data, error } = await supabaseClient.rpc(
    "consultar_equipo",
    { p_token_tarjeta: token }
  );

  if (error) {
    document.getElementById("estado").textContent =
      "Error: " + error.message;
    console.error(error);
    return;
  }

  if (!data || data.error) {
    document.getElementById("estado").textContent =
      "Tarjeta no válida o inactiva.";
    return;
  }

  document.getElementById("nombre").textContent = data.nombre;

  document.getElementById("dinero").textContent =
    "$" + Number(data.monedas).toLocaleString("es-CO");

  document.getElementById("tickets").textContent =
    data.tickets;

  document.getElementById("estado").style.display = "none";
  document.querySelector(".success").style.display = "flex";
}

iniciar();
</script>
</body>
</html>
