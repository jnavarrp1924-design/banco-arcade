<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tu raíz es nuestra raíz</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }
    main {
      max-width: 420px;
      margin: 40px auto;
      padding: 25px;
      background: #1e293b;
      border-radius: 16px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }
    button {
      background: #38bdf8;
      color: #082f49;
      font-weight: bold;
      cursor: pointer;
    }
    .dato {
      font-size: 22px;
      font-weight: bold;
      margin: 12px;
    }
    #estado { color: #bae6fd; }
  </style>
</head>
<body>
  <main>
    <h1>🌱 Tu raíz es nuestra raíz</h1>
    <p>Sistema de grupos y recompensas</p>
    <p id="estado">Conectando...</p>
    <section id="consulta" hidden>
      <h2 id="nombre"></h2>
      <p>Monedas</p>
      <div class="dato" id="monedas">0</div>
      <p>Puntos</p>
      <div class="dato" id="puntos">0</div>
      <p>Tickets</p>
      <div class="dato" id="tickets">0</div>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://ecuxshgbftpnurcfviir.supabase.co/rest/v1/";
    const SUPABASE_KEY = "sb_publishable_r8DPVtISS2k6_YKrA21Ydw_ujwqMDbr";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function iniciar() {
      const token = new URLSearchParams(window.location.search)
        .get("card");

      if (!token) {
        document.getElementById("estado").textContent =
          "Esperando una tarjeta NFC.";
        return;
      }

      document.getElementById("estado").textContent =
        "Consultando grupo...";

      const { data, error } = await supabaseClient.rpc(
        "consultar_equipo",
        { p_token_tarjeta: token }
      );

      if (error) {
  document.getElementById("estado").textContent =
    "Error: " + error.message;
  console.error(error);
  return;
}

      if (!data || data.error) {
        document.getElementById("estado").textContent =
          "Tarjeta no válida o inactiva.";
        return;
      }

      document.getElementById("nombre").textContent = data.nombre;
      document.getElementById("monedas").textContent =
        data.saldo_monedas;
      document.getElementById("puntos").textContent = data.puntos;
      document.getElementById("tickets").textContent = data.tickets;

      document.getElementById("consulta").hidden = false;
      document.getElementById("estado").textContent =
        "Consulta realizada correctamente.";
    }

    iniciar();
  </script>
</body>
</html>
