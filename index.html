
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080f1e">
  <title>Tu raíz es nuestra raíz</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --fondo: #080f1e;
      --panel: #101c30;
      --azul: #1769bd;
      --azul-claro: #3289e8;
      --rojo: #bd2638;
      --rojo-claro: #e04450;
      --texto: #f3f5fa;
      --texto-suave: #a6b2c5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 25px 15px;
      font-family: 'Outfit', sans-serif;
      color: var(--texto);
      background:
        radial-gradient(ellipse at 5% 12%, #17477c55, transparent 35%),
        radial-gradient(ellipse at 95% 80%, #8f1e3040, transparent 38%),
        linear-gradient(145deg, #080f1e, #0c1729 55%, #080d18);
      position: relative;
      overflow-x: hidden;
    }

    /* Fondo geométrico estilo arcade */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.15;
      background-image:
        linear-gradient(135deg, transparent 48%, #3474ae 49%, transparent 50%),
        linear-gradient(45deg, transparent 48%, #a82d42 49%, transparent 50%);
      background-size: 85px 85px, 115px 115px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    body::after {
      content: "";
      position: fixed;
      width: 340px;
      height: 340px;
      border: 1px solid #2867a522;
      border-radius: 50%;
      top: 25%;
      right: -245px;
      box-shadow:
        0 0 0 25px #2867a510,
        0 0 0 50px #2867a508;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 510px;
      margin: 0 auto;
    }

    .encabezado {
      text-align: center;
      padding: 25px 5px 30px;
    }

    .etiqueta {
      display: inline-block;
      color: #91a8c8;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 17px;
      padding: 8px 13px;
      border: 1px solid #344d6b;
      border-radius: 30px;
      background: #14223988;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 8vw, 44px);
      line-height: 1.04;
      font-weight: 900;
      letter-spacing: -1.5px;
      text-transform: uppercase;
    }

    h1 span {
      display: block;
      color: #e34a55;
      margin-top: 5px;
    }

    .subrayado {
      width: 115px;
      height: 4px;
      margin: 18px auto 0;
      border-radius: 10px;
      background: linear-gradient(90deg, var(--rojo), var(--azul-claro));
      transform: rotate(-2deg);
    }

    .grupo {
      text-align: center;
      margin: 10px 0 27px;
    }

    .grupo small {
      display: block;
      color: var(--texto-suave);
      font-size: 12px;
      letter-spacing: 5px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .grupo h2 {
      margin: 0;
      font-size: clamp(27px, 7vw, 36px);
      font-weight: 800;
      letter-spacing: 0.3px;
      overflow-wrap: anywhere;
      text-shadow: 0 3px 18px #00000055;
    }

    .panel {
      background:
        linear-gradient(145deg, #142239ee, #0b1628f5);
      border: 1px solid #263a57;
      border-radius: 25px;
      padding: 23px 13px;
      box-shadow:
        0 18px 45px #00000055,
        inset 0 1px 0 #ffffff0b;
      position: relative;
      overflow: hidden;
    }

    .panel::before {
      content: "";
      position: absolute;
      top: 0;
      left: 15%;
      width: 70%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #7da8d655, transparent);
    }

    #estado {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #a9bad2;
      font-size: 14px;
      text-align: center;
      margin: 0 0 19px;
    }

    .indicador {
      width: 9px;
      height: 9px;
      flex: 0 0 9px;
      border-radius: 50%;
      background: #4095e8;
      box-shadow: 0 0 12px #4095e8;
    }

    #consulta {
      display: block;
    }

    #consulta[hidden] {
      display: none;
    }

    .datos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .tarjeta {
      position: relative;
      min-width: 0;
      min-height: 245px;
      padding: 22px 9px 20px;
      border-radius: 21px;
      text-align: center;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .tarjeta::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 75px;
      bottom: -45px;
      right: -35px;
      border-radius: 50%;
      transform: rotate(-20deg);
      opacity: 0.45;
    }

    .dinero {
      background: linear-gradient(155deg, #102e55, #0b1b32 75%);
      border: 1px solid #176bc1;
      box-shadow: inset 0 0 28px #176bc122;
    }

    .dinero::after {
      background: #176bc1;
    }

    .tickets {
      background: linear-gradient(155deg, #4b1928, #211522 75%);
      border: 1px solid #bd3044;
      box-shadow: inset 0 0 28px #bd304422;
    }

    .tickets::after {
      background: #bd3044;
    }

    .icono {
      width: 66px;
      height: 66px;
      margin-bottom: 15px;
      position: relative;
      z-index: 1;
    }

    .rotulo {
      color: #aebbd0;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      margin-bottom: 14px;
    }

    .valor {
      position: relative;
      z-index: 1;
      font-size: clamp(25px, 6.5vw, 36px);
      font-weight: 900;
      letter-spacing: -1px;
      overflow-wrap: anywhere;
    }

    .unidad {
      color: #8ca6c8;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      margin-top: 8px;
    }

    .tickets .valor {
      font-size: 58px;
    }

    .confirmacion {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #aabbd0;
      font-size: 13px;
      text-align: center;
      margin: 24px 0 3px;
    }

    .check {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 25px;
      height: 25px;
      border: 1px solid #6686ac;
      border-radius: 50%;
      color: #b9d4f4;
      flex-shrink: 0;
    }

    .pie {
      text-align: center;
      color: #61748e;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      margin-top: 25px;
    }

    @media (max-width: 360px) {
      .panel {
        padding: 17px 9px;
      }

      .datos {
        gap: 8px;
      }

      .tarjeta {
        min-height: 215px;
        padding: 17px 6px;
      }

      .rotulo {
        letter-spacing: 2px;
      }

      .valor {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <main>
    <header class="encabezado">
      <div class="etiqueta">Vive el reto · Construye tu historia</div>

      <h1>
        Tu raíz es
        <span>nuestra raíz</span>
      </h1>

      <div class="subrayado"></div>
    </header>

    <section class="grupo">
      <small>GRUPO</small>
      <h2 id="nombre">Tu grupo</h2>
    </section>

    <section class="panel">
      <p id="estado">
        <span class="indicador"></span>
        Esperando una tarjeta NFC...
      </p>

      <section id="consulta" hidden>
        <div class="datos">

          <article class="tarjeta dinero">
            <svg class="icono" viewBox="0 0 64 64"
                 fill="none" xmlns="http://www.w3.org/2000/svg">
              <ellipse cx="25" cy="17" rx="17" ry="8"
                       stroke="#75b8ff" stroke-width="3"/>
              <path d="M8 17v25c0 5 8 9 17 9s17-4 17-9V17"
                    stroke="#75b8ff" stroke-width="3"/>
              <path d="M8 29c0 5 8 9 17 9s17-4 17-9"
                    stroke="#75b8ff" stroke-width="3"/>
              <path d="M8 40c0 5 8 9 17 9"
                    stroke="#75b8ff" stroke-width="3"/>
              <circle cx="45" cy="43" r="15"
                      fill="#123d70" stroke="#8bc5ff" stroke-width="3"/>
              <path d="M49 37c-2-3-9-3-9 1 0 5 10 2 10 7 0 4-7 6-11 2M45 34v19"
                    stroke="#d9edff" stroke-width="2"
                    stroke-linecap="round"/>
            </svg>

            <div class="rotulo">DINERO</div>
            <div class="valor" id="dinero">$0</div>
            <div class="unidad">COP</div>
          </article>

          <article class="tarjeta tickets">
            <svg class="icono" viewBox="0 0 64 64"
                 fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 17h40v10a6 6 0 0 0 0 12v10H12V39a6 6 0 0 0 0-12V17Z"
                    fill="#6e2434" stroke="#ff7a85" stroke-width="3"/>
              <path d="M32 20v25" stroke="#ff9ba3"
                    stroke-width="2" stroke-dasharray="3 4"/>
              <path d="m22 32 7 7 14-15"
                    stroke="#ffe1e3" stroke-width="3"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>

            <div class="rotulo">TICKETS</div>
            <div class="valor" id="tickets">0</div>
          </article>

        </div>

        <div class="confirmacion">
          <span class="check">✓</span>
          Consulta realizada correctamente.
        </div>
      </section>
    </section>

    <footer class="pie">
      TU RAÍZ ES NUESTRA RAÍZ
    </footer>
  </main>

  <script>
    const SUPABASE_URL = "https://ecuxshgbftpnurcfviir.supabase.co";
    const SUPABASE_KEY = "sb_publishable_r8DPVtISS2k6_YKrA21Ydw_ujwqMDbr";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function iniciar() {
      const token = new URLSearchParams(window.location.search)
        .get("card");

      if (!token) {
        document.getElementById("estado").textContent =
          "Esperando una tarjeta NFC.";
        return;
      }

      document.getElementById("estado").textContent =
        "Consultando grupo...";

      const { data, error } = await supabaseClient.rpc(
        "consultar_equipo",
        { p_token_tarjeta: token }
      );

      if (error) {
        document.getElementById("estado").textContent =
          "Error: " + error.message;
        console.error(error);
        return;
      }

      if (!data || data.error) {
        document.getElementById("estado").textContent =
          "Tarjeta no válida o inactiva.";
        return;
      }

      document.getElementById("nombre").textContent = data.nombre;

      document.getElementById("dinero").textContent =
        "$" + Number(data.monedas).toLocaleString("es-CO");

      document.getElementById("tickets").textContent =
        data.tickets;

      document.getElementById("consulta").hidden = false;

      // Se oculta el estado superior para evitar repetir
      // el mensaje de consulta realizada correctamente.
      document.getElementById("estado").style.display = "none";
    }

    iniciar();
  </script>
</body>
</html>
