
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080f1e">
<title>Tu raíz es nuestra raíz</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --navy:#030914;
  --blue:#071a3b;
  --blue-light:#17365f;
  --red:#681329;
  --red-light:#8d1c3b;
  --white:#f4f6fb;
  --muted:#9baec8;
}

* { box-sizing:border-box; }

body {
  margin:0;
  min-height:100vh;
  padding:22px 15px 35px;
  color:var(--white);
  font-family:'Rajdhani',sans-serif;
  background:#07111f;
  overflow-x:hidden;
  position:relative;
}

/* Ondas diagonales discretas: reemplazan la cuadrícula */
body::before {
  content:"";
  position:fixed;
  width:520px;
  height:520px;
  top:-270px;
  left:-280px;
  border:1px solid #1d4c7c55;
  border-radius:48%;
  transform:rotate(28deg);
  box-shadow:0 0 0 22px #12345a18,0 0 0 48px #12345a12,0 0 0 76px #12345a0c;
  pointer-events:none;
}

body::after {
  content:"";
  position:fixed;
  width:420px;
  height:420px;
  right:-300px;
  bottom:-285px;
  border:1px solid #8d1c3b66;
  border-radius:48%;
  transform:rotate(-25deg);
  box-shadow:0 0 0 22px #8d1c3b18,0 0 0 48px #8d1c3b12,0 0 0 76px #8d1c3b0c;
  pointer-events:none;
}

main {
  width:100%;
  max-width:510px;
  margin:auto;
  position:relative;
  z-index:1;
}

/* ENCABEZADO */

.topline {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:9px;
  color:#9eb6d6;
  font-size:10px;
  font-weight:800;
  letter-spacing:3px;
  margin:8px 0 23px;
}

.topline::before,
.topline::after {
  content:"";
  height:1px;
  flex:1;
  max-width:55px;
  background:linear-gradient(90deg,transparent,#46658b);
}

.topline::after {
  background:linear-gradient(90deg,#46658b,transparent);
}

.hero {
  text-align:center;
  position:relative;
  padding:10px 0 22px;
}

.hero::before {
  content:"";
  position:absolute;
  width:220px;
  height:110px;
  left:50%;
  top:0;
  transform:translateX(-50%);
  background:#174c83;
  filter:blur(75px);
  opacity:.3;
  z-index:-1;
}

.kicker {
  color:#b6c8e1;
  font-size:12px;
  font-weight:800;
  letter-spacing:4px;
  margin-bottom:12px;
}

h1 {
  margin:0;
  font-family:'Barlow Condensed',sans-serif;
  font-size:clamp(58px,14vw,78px);
  font-weight:700;
  line-height:.86;
  letter-spacing:-1px;
  text-transform:uppercase;
  text-shadow:0 5px 22px #0009;
}

h1 span {
  display:block;
  color:#681329;
  margin-top:8px;
  font-weight:700;
  text-shadow:0 1px 0 #a94c68,0 3px 0 #3b0b1a,0 7px 16px #000d,0 0 18px #68132944;
}

.hero-line {
  width:100px;
  height:5px;
  margin:19px auto 0;
  background:linear-gradient(90deg,#28639b,#681329);
  border-radius:8px;
  transform:skewX(-25deg);
}

/* IDENTIFICACIÓN DEL GRUPO */

.group-block {
  margin:18px 0 25px;
  text-align:center;
  position:relative;
}

.group-label {
  color:#91a9c8;
  font-size:10px;
  font-weight:800;
  letter-spacing:5px;
  margin-bottom:5px;
}

.group-name {
  font-family:'Barlow Condensed',sans-serif;
  font-size:clamp(38px,10vw,51px);
  font-weight:800;
  text-transform:uppercase;
  line-height:1;
  letter-spacing:1px;
  overflow-wrap:anywhere;
  text-shadow:0 4px 18px #0008;
}

.group-underline {
  width:65px;
  height:3px;
  margin:11px auto 0;
  background:var(--blue-light);
  border-radius:5px;
}

/* PANEL PRINCIPAL */

.dashboard {
  border:1px solid #6d94bd;
  border-radius:28px;
  padding:25px 17px 24px;
  background:linear-gradient(145deg,#0b1b31 0%,#0a192d 48%,#081426 100%);
  box-shadow:0 0 0 5px #0a1729,0 0 30px #1b4c7c35,0 22px 55px #000b,inset 0 1px 0 #a6c8f044;
  position:relative;
  overflow:hidden;
}

.dashboard::before {
  content:"";
  position:absolute;
  inset:7px;
  border:1px solid #86a9ce66;
  border-radius:20px;
  clip-path:polygon(0 4%,4% 0,96% 0,100% 4%,100% 96%,96% 100%,4% 100%,0 96%);
  pointer-events:none;
  z-index:0;
}

.dashboard::after { content:""; display:none; }

.status {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  min-height:39px;
  margin:0 0 14px;
  color:#afc0d8;
  font-size:13px;
  text-align:center;
}

.status-dot {
  width:8px;
  height:8px;
  border-radius:50%;
  background:#4b9df0;
  box-shadow:0 0 12px #4b9df0;
  flex-shrink:0;
}

/* CONTENEDOR DE TARJETAS */

.values {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  perspective:1200px;
}

.value-card {
  min-width:0;
  height:345px;
  position:relative;
  border-radius:21px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  padding:22px 10px;
  isolation:isolate;
  transform-style:preserve-3d;
  transition:transform .35s ease,box-shadow .35s ease;
}

.value-card:hover {
  transform:translateY(-6px) rotateX(2deg) rotateY(-2deg);
}

.value-card > * {
  position:relative;
  z-index:2;
}

.card-frame {
  position:absolute;
  inset:7px;
  border:1px solid #ffffff45;
  border-radius:12px;
  clip-path:polygon(0 5%,5% 0,95% 0,100% 5%,100% 95%,95% 100%,5% 100%,0 95%);
  box-shadow:inset 0 0 0 1px #ffffff20;
  pointer-events:none;
  z-index:1;
}

/* DETALLES COMUNES */

.card-icon {
  width:104px;
  height:104px;
  display:grid;
  place-items:center;
  border-radius:50%;
  transform:translateZ(25px);
}

.card-icon svg {
  width:82px;
  height:82px;
  filter:drop-shadow(0 9px 5px #0009);
}

.card-label {
  min-width:125px;
  text-align:center;
  padding:7px 15px;
  border-radius:6px;
  font-size:13px;
  font-weight:700;
  letter-spacing:3px;
  color:#f3f4f8;
  box-shadow:0 5px 8px #0008,inset 0 1px 1px #ffffff55;
  transform:translateZ(18px);
}

.card-value {
  width:100%;
  text-align:center;
  font-family:'Barlow Condensed',sans-serif;
  font-size:clamp(34px,7vw,49px);
  font-weight:600;
  letter-spacing:-1px;
  overflow-wrap:anywhere;
  color:#f8faff;
  -webkit-text-stroke:.2px #dce7ff;
  text-shadow:0 1px 0 #cbd8eb,0 2px 0 #71829d,0 3px 0 #34445d,0 5px 8px #000c,0 0 12px #a8c9ff22;
  transform:translateZ(20px);
}

.card-unit {
  font-family:'Rajdhani',sans-serif;
  font-size:12px;
  font-weight:700;
  letter-spacing:3px;
}

.card-bottom-line {
  width:65%;
  height:3px;
  border-radius:50%;
}

/* DINERO: AZUL MARINO MÁS OSCURO Y SOBRIO */

.money-card {
  color:#edf2ff;
  border:1px solid #54749b;
  background:linear-gradient(145deg,#173b69 0%,#102e55 35%,#081d39 78%,#12345d 100%);
  box-shadow:inset 0 2px 3px #ffffff55,inset 0 -9px 18px #020b18c9,0 15px 25px #000a,0 3px 0 #10255f;
}

.money-card::before {
  content:"";
  position:absolute;
  inset:0;
  opacity:.35;
  background:linear-gradient(135deg,#9ccaff22 0 12%,transparent 12% 68%,#9ccaff12 68% 69%,transparent 69%),radial-gradient(ellipse at 50% 20%,#7eb7ff30,transparent 66%);
  pointer-events:none;
}

/* Reflejo circular inferior derecho */
.money-card::after {
  content:"";
  position:absolute;
  width:180px;
  height:65px;
  background:linear-gradient(90deg,#5ba8ff44,#17447711);
  opacity:.52;
  bottom:-30px;
  right:-35px;
  transform:rotate(-18deg);
  border-radius:50%;
  pointer-events:none;
}

.money-card .card-icon {
  background:radial-gradient(circle,#1c416d,#091a34 72%);
  border:2px solid #779bc3;
  box-shadow:0 0 0 5px #557f991c,0 0 22px #4778e822,inset 0 0 15px #000b;
}

.money-card .card-label {
  background:linear-gradient(180deg,#294d75,#163354 55%,#0a1c35);
  border:1px solid #7899bc;
}

.money-card .card-value {
  color:#f8fbff;
  font-weight:600;
  text-shadow:0 1px 0 #d5e5ff,0 2px 0 #8ca5c4,0 3px 0 #425d80,0 5px 9px #000d,0 0 12px #8dc4ff33;
}

.money-card .card-unit { color:#c0d0ff; }

.money-card .card-bottom-line {
  background:#7796b8;
  box-shadow:0 0 12px #668bff44;
}

/* TICKETS: VINO TINTO A JUEGO CON EL TÍTULO */

.ticket-card {
  color:#fff0f2;
  border:1px solid #99435d;
  background:linear-gradient(145deg,#792039 0%,#681329 35%,#390d20 78%,#681329 100%);
  box-shadow:inset 0 2px 3px #ffffff35,inset 0 -9px 18px #120710c9,0 15px 25px #000a,0 3px 0 #461326;
}

.ticket-card::before {
  content:"";
  position:absolute;
  inset:9px;
  border:1px dashed #e8a5b777;
  border-radius:14px;
  opacity:.65;
  background:repeating-linear-gradient(135deg,transparent 0,transparent 12px,#ffb1ba10 13px,transparent 14px);
  pointer-events:none;
}

.ticket-card::after {
  content:"";
  position:absolute;
  width:180px;
  height:65px;
  background:linear-gradient(90deg,#b83b5b44,#68132911);
  opacity:.5;
  bottom:-30px;
  right:-35px;
  transform:rotate(-18deg);
  border-radius:50%;
  pointer-events:none;
}

.ticket-card .card-icon {
  background:radial-gradient(circle,#681d34,#2b0b19 72%);
  border:2px solid #a85c75;
  box-shadow:0 0 0 5px #9439491c,0 0 22px #ad2c3d33,inset 0 0 15px #000b;
}

.ticket-card .card-label {
  background:linear-gradient(180deg,#792b43,#50152a 55%,#300c1b);
  border:1px solid #a9687e;
}

.ticket-card .card-value {
  font-family:'Barlow Condensed',sans-serif;
  font-size:76px;
  line-height:.9;
  font-weight:600;
  color:#fff4f6;
  -webkit-text-stroke:.45px #f2c5d1;
  text-shadow:0 1px 0 #f2c5d1,0 2px 0 #b77a8d,0 3px 0 #653247,0 5px 9px #000d,0 0 12px #d65a7c33;
}

.ticket-card .card-unit { color:#edb8c7; }

.ticket-card .card-bottom-line {
  background:#b85d7b;
  box-shadow:0 0 12px #be3a4d55;
}

/* DETALLE INFERIOR */

.success {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  color:#b7c6d9;
  font-size:13px;
  text-align:center;
  margin:23px 0 2px;
}

.check {
  width:25px;
  height:25px;
  border:1px solid #6686ac;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#c8e1ff;
  flex-shrink:0;
}

.footer {
  margin-top:23px;
  text-align:center;
  color:#687e9c;
  font-size:10px;
  font-weight:800;
  letter-spacing:3px;
}

@media(max-width:420px) {
  body { padding:17px 10px 25px; }
  .dashboard { padding:18px 10px; }
  .values { gap:9px; }
  .value-card { height:300px; padding:15px 6px; }
  .card-icon { width:82px; height:82px; }
  .card-icon svg { width:70px; height:70px; }
  .card-value { font-size:25px; }
  .ticket-card .card-value { font-size:62px; }
  .card-label { min-width:0; padding:6px 12px; font-size:10px; }
  .card-unit { font-size:8px; letter-spacing:1px; }
}

@media(max-width:340px) {
  .value-card { height:270px; }
  .card-icon { width:68px; height:68px; }
  .card-icon svg { width:58px; height:58px; }
  .card-value { font-size:22px; }
  .ticket-card .card-value { font-size:55px; }
}
</style>
</head>

<body>
<main>

  <div class="topline">VIVE DESDE TU RAÍZ</div>

  <header class="hero">
    <h1>Tu raíz es <span>nuestra raíz</span></h1>
    <div class="hero-line"></div>
  </header>

  <section class="group-block">
    <div class="group-label">EQUIPO</div>
    <div class="group-name" id="nombre">Tu grupo</div>
    <div class="group-underline"></div>
  </section>

  <section class="dashboard">
    <p class="status" id="estado">
      <span class="status-dot"></span>
      Esperando una tarjeta NFC...
    </p>

    <!-- Las tarjetas se muestran inicialmente con valores de ejemplo.
         Al escanear una tarjeta válida, se actualizan con los datos reales. -->
    <section id="consulta">
      <div class="values">

        <!-- TARJETA DINERO -->
        <article class="value-card money-card">
          <div class="card-frame"></div>
          <div class="card-icon">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="32" cy="32" r="22" fill="#173b9a" stroke="#d8e2ff" stroke-width="2.5"/>
              <circle cx="32" cy="32" r="17" stroke="#8daaff" stroke-width="1.5"/>
              <path d="M39 23C36 19 25 20 25 26C25 33 39 29 39 37C39 44 27 46 23 40M32 17V47" stroke="#f0f3ff" stroke-width="3" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="card-label">DINERO</div>
          <div class="card-value" id="dinero">$100.000</div>
          <div class="card-unit">COP</div>
          <div class="card-bottom-line"></div>
        </article>

        <!-- TARJETA TICKETS -->
        <article class="value-card ticket-card">
          <div class="card-frame"></div>
          <div class="card-icon">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 17h40v10a6 6 0 0 0 0 12v10H12V39a6 6 0 0 0 0-12V17Z" fill="#A83C4A" stroke="#F08B91" stroke-width="2.5"/>
              <path d="M32 20v25" stroke="#F6B4B8" stroke-width="2" stroke-dasharray="3 3"/>
              <path d="m32 25 2.5 5 5.5 1-4 4 1 6-5-3-5 3 1-6-4-4 5.5-1 2.5-5Z" fill="#FFE0D2"/>
            </svg>
          </div>
          <div class="card-label">TICKETS</div>
          <div class="card-value" id="tickets">0</div>
          <div class="card-unit">TUS TICKETS</div>
          <div class="card-bottom-line"></div>
        </article>

      </div>
      <div class="success">
        <span class="check">✓</span>
        Consulta realizada correctamente.
      </div>
    </section>
  </section>

  <footer class="footer">TU RAÍZ ES NUESTRA RAÍZ</footer>
</main>

<script>
const SUPABASE_URL = "https://ecuxshgbftpnurcfviir.supabase.co";
const SUPABASE_KEY = "sb_publishable_r8DPVtISS2k6_YKrA21Ydw_ujwqMDbr";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function iniciar() {
  const token = new URLSearchParams(window.location.search)
    .get("card");

  if (!token) {
    document.getElementById("estado").textContent =
      "Vista previa: valores de ejemplo.";
    return;
  }

  document.getElementById("estado").textContent =
    "Consultando grupo...";

  const { data, error } = await supabaseClient.rpc(
    "consultar_equipo",
    { p_token_tarjeta: token }
  );

  if (error) {
    document.getElementById("estado").textContent =
      "Error: " + error.message;
    console.error(error);
    return;
  }

  if (!data || data.error) {
    document.getElementById("estado").textContent =
      "Tarjeta no válida o inactiva.";
    return;
  }

  document.getElementById("nombre").textContent = data.nombre;

  document.getElementById("dinero").textContent =
    "$" + Number(data.monedas).toLocaleString("es-CO");

  document.getElementById("tickets").textContent =
    data.tickets;

  document.getElementById("estado").style.display = "none";
  document.querySelector(".success").style.display = "flex";
}

iniciar();
</script>
</body>
</html>
