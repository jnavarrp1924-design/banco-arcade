
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080f1e">
  <title>Tu raíz es nuestra raíz</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --fondo: #080f1e;
      --azul: #1769bd;
      --azul-claro: #3997f5;
      --rojo: #bd2638;
      --rojo-claro: #ed5260;
      --texto: #f5f6fa;
      --suave: #a6b2c5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 22px 14px 30px;
      font-family: 'Outfit', sans-serif;
      color: var(--texto);
      background:
        radial-gradient(ellipse at 10% 15%, #17477c66, transparent 35%),
        radial-gradient(ellipse at 95% 80%, #8f1e3050, transparent 38%),
        linear-gradient(145deg, #080f1e, #0c1729 55%, #080d18);
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .13;
      background-image:
        linear-gradient(135deg, transparent 48%, #3474ae 49%, transparent 50%),
        linear-gradient(45deg, transparent 48%, #a82d42 49%, transparent 50%);
      background-size: 85px 85px, 115px 115px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }

    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 530px;
      margin: 0 auto;
    }

    .encabezado {
      text-align: center;
      padding: 25px 3px 30px;
    }

    .etiqueta {
      display: inline-block;
      color: #b6c7df;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 19px;
      padding: 9px 17px;
      border: 1px solid #456184;
      border-radius: 30px;
      background: linear-gradient(100deg, #142b49, #1b263d);
      box-shadow: 0 5px 20px #0004;
    }

    h1 {
      margin: 0;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(58px, 14vw, 82px);
      line-height: .88;
      font-weight: 400;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 5px 24px #0008;
    }

    h1 span {
      display: block;
      margin-top: 8px;
      color: #e44755;
      text-shadow: 0 3px 22px #bd263855;
    }

    .subrayado {
      width: 145px;
      height: 5px;
      margin: 20px auto 0;
      border-radius: 10px;
      background: linear-gradient(90deg, var(--rojo), var(--azul-claro));
      transform: rotate(-2deg);
      box-shadow: 0 0 15px #327ed955;
    }

    .grupo {
      text-align: center;
      margin: 12px 0 27px;
    }

    .grupo small {
      display: block;
      color: #8fa8c8;
      font-size: 12px;
      letter-spacing: 6px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .grupo h2 {
      margin: 0;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(38px, 9vw, 48px);
      letter-spacing: 1.5px;
      line-height: 1;
      overflow-wrap: anywhere;
      text-shadow: 0 3px 18px #0008;
    }

    .panel {
      background: linear-gradient(145deg, #142239f5, #0b1628f7);
      border: 1px solid #2b405e;
      border-radius: 27px;
      padding: 23px 12px;
      box-shadow: 0 18px 45px #0007, inset 0 1px 0 #ffffff0c;
      position: relative;
      overflow: hidden;
    }

    .panel::before {
      content: "";
      position: absolute;
      top: 0;
      left: 15%;
      width: 70%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #7da8d677, transparent);
    }

    #estado {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #b5c5dc;
      font-size: 14px;
      text-align: center;
      margin: 0 0 19px;
    }

    .indicador {
      width: 9px;
      height: 9px;
      flex: 0 0 9px;
      border-radius: 50%;
      background: #4095e8;
      box-shadow: 0 0 12px #4095e8;
    }

    #consulta {
      display: block;
    }

    #consulta[hidden] {
      display: none;
    }

    .datos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .tarjeta {
      position: relative;
      isolation: isolate;
      min-width: 0;
      min-height: 255px;
      padding: 22px 8px 20px;
      border-radius: 23px;
      text-align: center;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 28px #0005;
    }

    .tarjeta > * {
      position: relative;
      z-index: 2;
    }

    /* Textura decorativa de las tarjetas */
    .tarjeta::before {
      content: "";
      position: absolute;
      z-index: 0;
      inset: 0;
      opacity: .35;
      background:
        repeating-linear-gradient(
          135deg,
          transparent 0px,
          transparent 13px,
          #ffffff0b 14px,
          transparent 16px
        );
    }

    .tarjeta::after {
      content: "";
      position: absolute;
      z-index: 0;
      width: 220px;
      height: 115px;
      bottom: -75px;
      right: -45px;
      border-radius: 50%;
      transform: rotate(-20deg);
    }

    .dinero {
      background:
        radial-gradient(circle at 50% 15%, #287acb88, transparent 42%),
        linear-gradient(150deg, #174c83, #0b1b32 78%);
      border: 1px solid #3289e8;
      box-shadow: inset 0 0 35px #3289e833, 0 12px 28px #0005;
    }

    .dinero::after {
      background: #2379cc;
      box-shadow: 0 0 45px #3289e855;
    }

    .tickets {
      background:
        radial-gradient(circle at 50% 15%, #b9364c88, transparent 42%),
        linear-gradient(150deg, #6a2639, #241522 78%);
      border: 1px solid #dc4657;
      box-shadow: inset 0 0 35px #e0445033, 0 12px 28px #0005;
    }

    .tickets::after {
      background: #b82c43;
      box-shadow: 0 0 45px #e0445055;
    }

    .icono {
      width: 76px;
      height: 76px;
      margin-bottom: 13px;
      filter: drop-shadow(0 5px 8px #0006);
    }

    .rotulo {
      color: #d1d9e6;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 4px;
      margin-bottom: 13px;
    }

    .valor {
      font-size: clamp(25px, 6.5vw, 37px);
      font-weight: 900;
      letter-spacing: -1.5px;
      overflow-wrap: anywhere;
      text-shadow: 0 3px 12px #0005;
    }

    .unidad {
      color: #a9c8ec;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 3px;
      margin-top: 8px;
    }

    .tickets .valor {
      font-size: 62px;
    }

    .confirmacion {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #b7c6d9;
      font-size: 13px;
      text-align: center;
      margin: 24px 0 3px;
    }

    .check {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 25px;
      height: 25px;
      border: 1px solid #6686ac;
      border-radius: 50%;
      color: #c8e1ff;
      flex-shrink: 0;
    }

    .pie {
      text-align: center;
      color: #7186a3;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      margin-top: 25px;
    }

    @media (max-width: 360px) {
      .panel {
        padding: 17px 8px;
      }

      .datos {
        gap: 8px;
      }

      .tarjeta {
        min-height: 220px;
        padding: 17px 5px;
      }

      .rotulo {
        letter-spacing: 2px;
      }

      .valor {
        font-size: 24px;
      }

      .icono {
        width: 62px;
        height: 62px;
      }
    }
  </style>
</head>

<body>
  <main>
    <header class="encabezado">
      <div class="etiqueta">VIVE DESDE TU RAÍZ</div>

      <h1>
        Tu raíz es
        <span>nuestra raíz</span>
      </h1>

      <div class="subrayado"></div>
    </header>

    <section class="grupo">
      <small>GRUPO</small>
      <h2 id="nombre">Tu grupo</h2>
    </section>

    <section class="panel">
      <p id="estado">
        <span class="indicador"></span>
        Esperando una tarjeta NFC...
      </p>

      <section id="consulta" hidden>
        <div class="datos">

          <article class="tarjeta dinero">
            <svg class="icono" viewBox="0 0 64 64"
                 fill="none" xmlns="http://www.w3.org/2000/svg">
              <ellipse cx="25" cy="17" rx="17" ry="8"
                       stroke="#9bd0ff" stroke-width="3"/>
              <path d="M8 17v25c0 5 8 9 17 9s17-4 17-9V17"
                    stroke="#75b8ff" stroke-width="3"/>
              <path d="M8 29c0 5 8 9 17 9s17-4 17-9"
                    stroke="#75b8ff" stroke-width="3"/>
              <path d="M8 40c0 5 8 9 17 9"
                    stroke="#75b8ff" stroke-width="3"/>
              <circle cx="45" cy="43" r="15"
                      fill="#123d70" stroke="#b5dcff" stroke-width="3"/>
              <path d="M49 37c-2-3-9-3-9 1 0 5 10 2 10 7 0 4-7 6-11 2M45 34v19"
                    stroke="#d9edff" stroke-width="2"
                    stroke-linecap="round"/>
            </svg>

            <div class="rotulo">DINERO</div>
            <div class="valor" id="dinero">$0</div>
            <div class="unidad">COP</div>
          </article>

          <article class="tarjeta tickets">
            <svg class="icono" viewBox="0 0 64 64"
                 fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 17h40v10a6 6 0 0 0 0 12v10H12V39a6 6 0 0 0 0-12V17Z"
                    fill="#7c293b" stroke="#ff9aa3" stroke-width="3"/>
              <path d="M32 20v25" stroke="#ffb1b8"
                    stroke-width="2" stroke-dasharray="3 4"/>
              <path d="m22 32 7 7 14-15"
                    stroke="#ffe1e3" stroke-width="3"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>

            <div class="rotulo">TICKETS</div>
            <div class="valor" id="tickets">0</div>
          </article>

        </div>

        <div class="confirmacion">
          <span class="check">✓</span>
          Consulta realizada correctamente.
        </div>
      </section>
    </section>

    <footer class="pie">
      TU RAÍZ ES NUESTRA RAÍZ
    </footer>
  </main>

  <script>
    const SUPABASE_URL = "https://ecuxshgbftpnurcfviir.supabase.co";
    const SUPABASE_KEY = "sb_publishable_r8DPVtISS2k6_YKrA21Ydw_ujwqMDbr";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function iniciar() {
      const token = new URLSearchParams(window.location.search)
        .get("card");

      if (!token) {
        document.getElementById("estado").textContent =
          "Esperando una tarjeta NFC.";
        return;
      }

      document.getElementById("estado").textContent =
        "Consultando grupo...";

      const { data, error } = await supabaseClient.rpc(
        "consultar_equipo",
        { p_token_tarjeta: token }
      );

      if (error) {
        document.getElementById("estado").textContent =
          "Error: " + error.message;
        console.error(error);
        return;
      }

      if (!data || data.error) {
        document.getElementById("estado").textContent =
          "Tarjeta no válida o inactiva.";
        return;
      }

      document.getElementById("nombre").textContent = data.nombre;

      document.getElementById("dinero").textContent =
        "$" + Number(data.monedas).toLocaleString("es-CO");

      document.getElementById("tickets").textContent =
        data.tickets;

      document.getElementById("consulta").hidden = false;
      document.getElementById("estado").style.display = "none";
    }

    iniciar();
  </script>
</body>
</html>
